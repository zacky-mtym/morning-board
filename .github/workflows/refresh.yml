name: Refresh morning board

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch public data
        env:
          ICS_URL_W: ${{ secrets.ICS_URL_W }}
          ICS_URL_F: ${{ secrets.ICS_URL_F }}
          ICS_URL_P: ${{ secrets.ICS_URL_P }}
        run: python scripts/build_board.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/board.json data.js data/calendar.json
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh morning board data"
            git push
          fi
